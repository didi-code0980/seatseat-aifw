# deseeded tickets are still waiting on AUT rows — Account management UI and Role assignment UI —
# and neither is this one. AUT-01 is sign-in and sign-out only. It is the runtime path ADR-006
# defines and SYS-01 leaves out: SYS-01 removes Better Auth and constructs the `@supabase/ssr`
# client server-side, this ticket builds what uses it.
