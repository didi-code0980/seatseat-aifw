# Supabase identity maps to a `Member` for `Member.role` while `DATA_SOURCE=mock` and
# `Member.authUserId` does not exist. It has teeth in two directions. If the answer needs the column,
# `schema_delta` stops being `none`, `prisma/schema.prisma` is still a DRAFT under RULE-09, and a
# human signature lands in the middle of the loop — the trap SYS-01's row was written to avoid.
# If the answer does not need it, the mapping is a mock-only convention that a later ticket has to
# unwind. The BA answers by asking, not by choosing: this is a human decision, and inventing either
# branch is prohibited. `schema_delta` stays `none` below because that is what is true today, not
# because the question is settled.
#
# invariants_touched is [INV-08], transcribed from the feature row. It is a warning rather than a
# reassurance, for the same reason it is on SYS-01: ADR-006 replaced `disableSignUp: true` with a
# client-side flag in localStorage, which sits on the machine of the person it restrains and enforces
# nothing against anyone who opens developer tools. `.ai/registry/invariants.md` says so at the
# invariant itself and MD-14 carries the fix shape. A sign-in surface is precisely where self-signup
# would appear if it appeared at all, so QA should assert the flag behaves as specified and should
# NOT report that INV-08 is enforced. The BA may extend or narrow this list at SPEC; SEA-01 extended
# its transcribed four to seven, MEM-01 narrowed its four to two.
#
# NOTHING PAST `DATA_SOURCE=mock` IS TESTABLE UNTIL A SUPABASE PROJECT EXISTS. `SUPABASE_URL` and
# `SUPABASE_ANON_KEY` are declared by SYS-01 in `.env.example` and consumed here, not re-declared.
# ADR-006 records that they hold no real values yet. That is a second human dependency alongside
# SYS-01, it is not expressible in `depends_on`, and it is written here so it is not discovered at QA.
