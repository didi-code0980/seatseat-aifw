# Notes on fields that are easy to get wrong:
#
# invariants_touched  [] means "considered, none engaged". Absent means nobody looked.
#                     Definition of Ready requires it to be explicit.
# allowed_paths       [] is a control, not a placeholder. guard-allowed-paths.mjs blocks every
#                     write outside this ticket folder while it is empty. DESIGN fills it.
# rework_count        Only Developer-caused failures increment it (RULE-08). Two failures
#                     escalate (RULE-06).
# chat_budget         Six messages per pair per ticket (RULE-15). chat-guard.mjs increments
#                     `used` and blocks at `max`. Pairs absent from this map are not chattable.
# sync_enabled        false by default (RULE-10). Turn on per ticket, after the loop is proven.
