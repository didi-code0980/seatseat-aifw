                      # DoR item 3 passes. Recorded rather than left empty because it is true and
                      # checkable: members cannot be assigned to groups until groups can be created,
                      # and GRP-01 is the ticket that made them creatable. Every ticket this project
                      # has issued carried `[]` here, which made DoR item 3 vacuous six times running.
invariants_touched: []   # PROVISIONAL, AND IT MATCHES THE REGISTRY ROW RATHER THAN ASSERTING MORE
                         # THAN IT. That row says `[]` and says why: "nothing in invariants.md
                         # mentions Group, but member assignment writes MEM's surface, and SPEC
                         # determines the real set." The `ba` re-checks and does not transcribe —
                         # SEA-01 went from four to seven at SPEC, MEM-01 from four to two. INV-12 is
                         # the one worth reasoning through explicitly: it governs member DELETION, and
                         # nothing here deletes a member, but the file this ticket writes is the file
                         # INV-12 protects.
