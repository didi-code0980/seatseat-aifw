# TRANSCRIBED from the features.md row, not reasoned. `ba` owes per-ID reasoning at SPEC.
#
# THE SCOPE QUESTION SPEC MUST SETTLE FIRST, because it decides which group owns this ticket:
#
#   Does SEA-01 include seat PLACEMENT — creating a seat at a grid coordinate with a footprint?
#
#   No  -> assignment and release only. The four IDs below are right, and this stays a SEA ticket.
#   Yes -> INV-10 joins the list, and `src/lib/data/types.ts:77` says every ticket carrying INV-10
#          is a LAY ticket. The row would move groups, and the standards call INV-10 "the failure
#          dnd-kit produces most easily and the eye catches least reliably" — which is an argument
#          for giving it its own ticket rather than appending it to this one.
#
# INV-06 is why this ticket writes mock/devices.ts. Releasing an occupant must auto-downgrade that
# seat's primary device; that is a write, not a read, and it is the whole reason DEV-01 had to land
# first.
#
# CONFIRMED AND EXTENDED by `ba` at SPEC on 2026-08-24, with per-ID reasoning in 01-story.md.
#
# THE SCOPE QUESTION IS SETTLED: NO. Placement is NOT in this ticket. INV-10 is not on the list,
# the row stays in SEA, and the reasoning is the first section of 01-story.md. Grounds, in the
# order they bind: the features.md row already excludes placement; data-model.md makes INV-10 the
# defining marker of a LAY ticket, so carrying it would make this a LAY ticket wearing a SEA
# prefix; and the two acts read and write disjoint fields — placement is where a seat IS, occupancy
# is who SITS there.
#
# All four transcribed IDs survive. Three are ADDED, on the ledger's own instruction to follow
# indirect chains: INV-05, because the ledger states INV-06 is what INV-05 forces to happen when
# occupancy ends, so listing the consequence without its cause leaves R8 checking a mechanism
# without checking what it is for; INV-04, one-directionally — release only ever REMOVES a primary
# designation, so the risk is the assignment path promoting one, which AC-11 refuses; and INV-07,
# because the release path decides what becomes of the seat's device associations and this story
# chooses that they do not move, which is a choice INV-07 permits either way and therefore needs a
# criterion rather than a silence.
#
# INV-08, INV-10, INV-11 and INV-12 were reasoned through and found not engaged, with the reasoning
# in the story so R8 can check it. INV-12 is the interesting one: SEA-01's release path is the
# mechanism INV-12's "the references are removed first" refers to, so the obligation is negative and
# is discharged by AC-5 being the ticket's headline behaviour.
invariants_touched: [INV-01, INV-02, INV-03, INV-04, INV-05, INV-06, INV-07]
# [] is a control, not a placeholder — but note that guard-allowed-paths.mjs is unwired as of
# ADR-004, so nothing refuses a write outside this list at write time. Review check R1 and
# scripts/check-allowed-paths.mjs in CI are what remain, and MD-09 records that the CI check is
# skipped entirely on any branch not named feat/SEA-01.
# Enumerated by tech-lead-design at DESIGN, 2026-08-24. Reasoning in 02-design.md section 5.
#
# Two entries that look like scope creep and are not:
#   src/app/(app)/seats/page.tsx is REWRITTEN, not created — it exists as a Phase B read-only
#     scaffold with no occupant column and no controls (02-design.md F-6).
#   tests/e2e/smoke.spec.ts is here because seat rows are re-keyed from `id` to `code`, which moves
#     the `seats-status-<id>` selector that suite asserts on. Same reason it was in DEV-01's list.
#
# Four things deliberately ABSENT, each of which a Developer might reach for:
#   src/lib/data/mock/devices.ts   — the INV-06 downgrade lives in mock/seats.ts and reaches the same
#                                    array through ./store, exactly as deleteRoom does (F-5). This
#                                    corrects the seeding comment at the top of this file.
#   src/lib/data/mock/store.ts     — no new binding. MEM-01 may need one; SEA-01 must not.
#   src/lib/data/fixtures.ts       — Q-4 is answered yes by the seed as it stands (F-3).
#   src/lib/auth/permissions.ts    — this ticket implements no gate, so it adds no helper.
