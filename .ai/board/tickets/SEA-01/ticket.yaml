                      # ba's size_estimate, so nothing routes back to SPEC.
                      #
                      # Not XL: none of the three triggers is met. schema_delta is `none`; no existing
                      # src/lib/data/ signature changes (two functions are ADDED to seats, none
                      # altered); and the types.ts change is two new outcome types with no existing
                      # type modified, so no existing caller has to follow. The operating model's own
                      # test is "whether existing callers must change, not whether the seam was
                      # touched at all", and it calls adding seam functions ordinary feature work.
                      #
                      # Not L: eleven is inside the ceiling with one to spare, and the two candidates
                      # for a twelfth are absent by decision rather than by luck — see 02-design.md
                      # section 5 for mock/devices.ts (F-5) and fixtures.ts (F-3).
# ROO-01 and DEV-01 are both DONE and merged. MEM-01 does not block this: the two are disjoint, and
# nothing SEA-01 needs is produced by it.
