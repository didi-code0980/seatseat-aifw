  - "src/lib/data/mock/seats.ts"
  - "src/lib/data/prisma/seats.ts"
  - "tests/unit/seats.test.ts"
  - "tests/e2e/seats.spec.ts"
  - "tests/e2e/smoke.spec.ts"
  - ".ai/board/tickets/SEA-01/**"
