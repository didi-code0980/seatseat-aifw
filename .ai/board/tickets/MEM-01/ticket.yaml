#
# THE QUESTION SPEC MUST ANSWER FIRST, because it decides whether this ticket can run beside DEV-01:
#
#   Deleting a member who currently occupies a seat — refuse, or cascade?
#
#   Refuse  -> Member writes touch no seat and no device. allowed_paths stay disjoint from DEV-01's
#              and the two tickets run in parallel. invariants_touched narrows, probably to [].
#   Cascade -> The delete is an occupant exit, so INV-06 fires and the seat's primary device must
#              auto-downgrade. That writes src/lib/data/mock/devices.ts — the file DEV-01 holds.
#              The tickets collide and MEM-01 waits for DEV-01 to merge before DESIGN.
#
# No invariant in the ledger answers this. INV-11 answered the equivalent question for rooms and was
# issued by a human to do it; there is no INV for members. Raise it, do not assume it.
#
# NARROWED by `ba` at SPEC on 2026-08-23, after the operator answered Q-1 `refuse` and it was issued
# as INV-12 under ADR-005. Per-ID reasoning is in 01-story.md.
#
# INV-08 — engaged unconditionally. This is the surface people enter the system on. ADR-003 is what
# lets it create a person without creating an account: Member.authUserId is nullable and a null
# means someone the organization tracks who cannot sign in. AC-4 keeps the create form from
# acquiring the credential field that would make it the self-signup route INV-08 removes.
#
# INV-12 — engaged, and MEM-01 is the ticket that implements it. AC-10 is the seat half, AC-11 the
# device half, kept apart so a system enforcing one and not the other fails a test. ADR-005 is
# explicit that INV-12 must be on this row and not only INV-08, because a ticket that introduces an
# invariant and does not list it is the one place R8 is guaranteed to miss.
#
# INV-01, INV-05 and INV-06 were on this list conditionally and are DISCHARGED by ADR-005. They were
# the cascade branch: a member delete would have been an occupant exit, INV-06 would have fired on
# every seat, and the downgrade writes the device file. The refusal produces no occupant exit, so
# MEM-01 writes nothing under the device surface and its allowed_paths collide with no device
# ticket. The question in the header above is ANSWERED; it is left in place as the record of what
# was asked. INV-02, INV-03, INV-04, INV-07, INV-10 and INV-11 were reasoned through and found not
# engaged, and that reasoning is in the story so R8 can check it.
invariants_touched: [INV-08, INV-12]
