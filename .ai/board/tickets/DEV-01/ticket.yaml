# state enum: IDEA TRIAGE BACKLOG SPEC READY DESIGN IN_PROGRESS REVIEW QA REWORK ESCALATED DONE
# Seeded from .ai/templates/ticket.yaml at 2026-08-23, after a human added the DEV-01 row to
# .ai/registry/features.md. This is the re-seed the backlog's "Deseeded" section describes: the
# ticket was removed in Phase C for having no feature row, and returns unchanged now that it has one.
#
# No story, design, or acceptance criteria here — those are agent output. feature_ids resolves
# against .ai/registry/features.md.
id: DEV-01
title: "Device CRUD UI"
feature_ids: [DEV-01]
group: DEV
state: BACKLOG
owner: ""
branch: ""
size_estimate: ""     # S|M — set by ba at SPEC; gates DoR
size: ""              # S|M|L|XL — set by tech-lead-design at DESIGN; decides splitting
# Empty deliberately. ROO-01 is DONE and merged, so nothing here waits on it. The seam functions
# DEV-01 needs (listDevices, and whatever create/update/delete it specifies) sit beside the room
# functions rather than on top of them.
depends_on: []
# TRANSCRIBED from the features.md row, not reasoned. `ba` owes per-ID reasoning at SPEC and may
# add or remove IDs — this is a starting point, not a verdict. ROO-01 shipped with `[]` here and it
# was wrong: `[]` asserts "considered, none engaged", which nobody had done. Four IDs cited from the
# registry is a weaker claim than that and a truer one.
#
# What SPEC has to settle, because ROO-01 only touched these through a cascade and DEV-01 enforces
# them directly: INV-04, INV-05 and INV-06 govern primary devices — at most one per seat, and the
# primary belonging to whoever occupies it. This is the ticket where those become code rather than
# a consequence of deleting a room.
invariants_touched: [INV-04, INV-05, INV-06, INV-07]
# [] is a control, not a placeholder: guard-allowed-paths.mjs blocks every write outside this ticket
# folder while it is empty. DESIGN fills it.
allowed_paths: []
schema_delta: none
requires_adr: false
rework_count: 0
# Four pairs, copied from the template as-is. The template omits `tech-lead-design->ba` and
# `ba->product` although the chat topology in .ai/01-operating-model.md permits both — that is MD-04,
# an open decision, and seeding a ticket is not the place to settle it. ROO-01's Q1 to Q3 went
# through that missing edge unbudgeted and uncounted; expect the same here until MD-04 is closed.
chat_budget:
  developer->tech-lead-design: { used: 0, max: 6 }
  developer->ba:               { used: 0, max: 6 }
  qa->ba:                      { used: 0, max: 6 }
  qa->tech-lead-design:        { used: 0, max: 6 }
tracker: { provider: clickup, external_id: "", sync_enabled: false }
gates:
  spec:   { passed: false, at: null }
  design: { passed: false, at: null }
  review: { passed: false, at: null }
  qa:     { passed: false, at: null }
