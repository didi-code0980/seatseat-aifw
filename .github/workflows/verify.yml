name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Exactly two status check names: `verify` and `allowed-paths`. Branch protection points at those
# two. Do not split into six — every extra job name is another thing that has to be configured, kept
# green, and explained.
#
# docs-audit runs as a conditional step inside `verify` rather than as its own job, because a third
# job would be a third status check name.

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect governance changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if git diff --name-only "$BASE"...HEAD | grep -qE '^(\.ai/|\.claude/)'; then
            echo "governance=true" >> "$GITHUB_OUTPUT"
          else
            echo "governance=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: docs-audit
        if: steps.changes.outputs.governance == 'true'
        run: node scripts/check-docs.mjs

      # The file list is expanded by the shell, not by node. `node --test <dir>` works on Node 20 but
      # fails with MODULE_NOT_FOUND on Node 23, and `node --test '<glob>'` needs Node 21+. The shell
      # form works on every version, which matters because this is also the command an operator runs
      # by hand.
      #
      # settings-integrity.test.mjs runs here: it is the second detector for settings.json being
      # clobbered by session permission grants. The first is `git diff .claude/settings.json`, which
      # only helps if a human looks.
      # scripts/tests covers check-docs.mjs itself. The audit is a control like any other, and a
      # control nobody tests is a control nobody has observed failing.
      - name: hook guards
        run: node --test .claude/hooks/tests/*.test.mjs scripts/tests/*.test.mjs

      - name: Application scaffold present
        run: |
          if [ ! -f package.json ]; then
            echo "::error::package.json is absent — the Phase B scaffold has not landed, so pnpm verify cannot run."
            echo "This job is expected to fail until Phase B completes. Do not enable branch protection yet."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: pnpm verify
        run: pnpm verify

      # AC-9 — the committed table types cannot drift from the migrations.
      #
      # It REGENERATES AND DIFFS. A difference fails the run; it must never rewrite
      # `supabase/types.generated.ts` in place, because a job that silently fixes the file removes
      # the only signal that the schema and the committed types disagreed.
      #
      # Generated from a LOCAL RESET of `supabase/migrations/`, never from the linked cloud project
      # (ADR-007 OQ-2). Types generated from the cloud describe whatever that project currently
      # holds, which is not necessarily what the migrations say — and with one Supabase project a
      # hand-edit in the dashboard would propagate into the committed types with nothing to catch it.
      # Generating from the migrations makes them the only source, and this diff is what holds them
      # to it.
      #
      # `supabase start` runs Postgres in Docker, which `ubuntu-latest` has. That requirement is new
      # to this repository and it contradicts `.ai/standards/integrations.md` §"Docker is optional";
      # correcting that document is a steward change, recorded as `D-1` in SYS-02's design.
      - name: Generated types match the migrations
        run: |
          pnpm supabase start
          pnpm supabase db reset --local --no-seed
          pnpm supabase gen types typescript --local > /tmp/types.generated.ts
          diff -u supabase/types.generated.ts /tmp/types.generated.ts

  allowed-paths:
    name: allowed-paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Duplicates review check R1 deliberately. R1 runs inside the review agent's own session, where
      # the agent both performs and reports the check. This runs where it can be neither skipped nor
      # misreported.
      - name: check-allowed-paths
        run: node scripts/check-allowed-paths.mjs
