name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Exactly two status check names: `verify` and `allowed-paths`. Branch protection points at those
# two. Do not split into six — every extra job name is another thing that has to be configured, kept
# green, and explained.
#
# docs-audit runs as a conditional step inside `verify` rather than as its own job, because a third
# job would be a third status check name.

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect governance changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if git diff --name-only "$BASE"...HEAD | grep -qE '^(\.ai/|\.claude/)'; then
            echo "governance=true" >> "$GITHUB_OUTPUT"
          else
            echo "governance=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: docs-audit
        if: steps.changes.outputs.governance == 'true'
        run: node scripts/check-docs.mjs

      # The file list is expanded by the shell, not by node. `node --test <dir>` works on Node 20 but
      # fails with MODULE_NOT_FOUND on Node 23, and `node --test '<glob>'` needs Node 21+. The shell
      # form works on every version, which matters because this is also the command an operator runs
      # by hand.
      #
      # settings-integrity.test.mjs runs here: it is the second detector for settings.json being
      # clobbered by session permission grants. The first is `git diff .claude/settings.json`, which
      # only helps if a human looks.
      # scripts/tests covers check-docs.mjs itself. The audit is a control like any other, and a
      # control nobody tests is a control nobody has observed failing.
      - name: hook guards
        run: node --test .claude/hooks/tests/*.test.mjs scripts/tests/*.test.mjs

      - name: Application scaffold present
        run: |
          if [ ! -f package.json ]; then
            echo "::error::package.json is absent — the Phase B scaffold has not landed, so pnpm verify cannot run."
            echo "This job is expected to fail until Phase B completes. Do not enable branch protection yet."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: pnpm verify
        run: pnpm verify

      # `pnpm test:db` — the database-backed lane. SYS-02 `02-design.md` sections 6.2 and 6.4.
      #
      # NO NEW JOB NAME, and the header above says why: exactly two status checks exist, branch
      # protection points at those two, and a third would be another thing to configure, keep green
      # and explain. So this runs inside `verify`, after `pnpm verify`.
      #
      # THE BROWSER INSTALL IS HERE BECAUSE `pnpm test:db` IS THE FIRST PLAYWRIGHT RUN THIS
      # REPOSITORY PERFORMS ON A RUNNER. `pnpm test:e2e` has never run in CI and this design does not
      # add it. Without the install the lane would fail on a missing browser rather than on the
      # product.
      - name: Install the browser test:db needs
        run: pnpm exec playwright install --with-deps chromium

      # THIS REPLACES THE `Generated types match the migrations` STEP, which did the right thing and
      # was not what AC-9 needed: `06-test-report.md` recorded AC-9 PARTIAL because "every AC maps to
      # a named test" is a Definition of Done item and a workflow step carries no test name. The
      # regeneration moved into the lane as `tests/db/types-drift.test.ts`, which this command runs.
      # The behaviour is identical — regenerate from a LOCAL reset of `supabase/migrations/`, never
      # from the cloud project (ADR-007 OQ-2), fail on a difference, never rewrite the committed file
      # in place. What changed is that it now has an AC ID and a name.
      #
      # `REQUIRE_LOCAL_STACK: "1"` turns the runner's preflight from a skip into a failure. Without
      # it a runner that lost Docker would report this lane green, which is the whole reason the lane
      # is not-collected rather than skipped. `ubuntu-latest` has Docker; that requirement
      # contradicts `.ai/standards/integrations.md` §"Docker is optional", and correcting that
      # document is a steward change, recorded as `D-1` in SYS-02's design.
      - name: pnpm test:db
        env:
          REQUIRE_LOCAL_STACK: "1"
        run: pnpm test:db

  allowed-paths:
    name: allowed-paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Duplicates review check R1 deliberately. R1 runs inside the review agent's own session, where
      # the agent both performs and reports the check. This runs where it can be neither skipped nor
      # misreported.
      - name: check-allowed-paths
        run: node scripts/check-allowed-paths.mjs
