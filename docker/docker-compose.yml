name: seat-device-tracking

# Postgres is hosted on Supabase. There is no database service here and no named volume — see
# ADR-002, and ADR-007, which made Supabase the data CLIENT as well as the host.
#
# **Docker is optional for running the application.** `pnpm dev` needs Node and a Supabase project;
# it does not need a container. This file exists to run the application image, which is useful for
# checking the production build behaves, and is not on the path of ordinary work.
#
# It IS needed for one thing now, and that thing is not this file: `supabase db reset` and
# `supabase gen types typescript --local` run the CLI's own Postgres stack in containers
# (ADR-007 OQ-2). That is a schema-change activity, not a run-the-app activity.

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Since ADR-007 the default is `supabase`, so this image comes up against the real database
      # unless it is told otherwise. `mock` still works and needs nothing below it.
      DATA_SOURCE: ${DATA_SOURCE:-supabase}
      # From the host environment, with no defaults. A compose file that invented a fallback URL or
      # key would be a credential in version control, and a wrong one.
      #
      # No connection string appears here and that is not an omission: the running application speaks
      # HTTP to PostgREST and opens no Postgres connection. DIRECT_URL is a migration credential and
      # migrations are not run from this image.
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL — Project Settings -> API}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY — Project Settings -> API}
    ports:
      - "3000:3000"
